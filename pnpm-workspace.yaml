packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency lifecycle scripts by default.
# Prisma needs its postinstall to place the query engine and build the client.
allowBuilds:
  "@biomejs/biome": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true

# pnpm 11 quarantines very recently published versions; these are
# deliberate, verified pins.
minimumReleaseAgeExclude:
  - zod@4.5.2
  - '@expo/cli@57.0.22'
  - '@expo/ui@57.0.16'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo-router@57.0.19
  - expo@57.0.20
