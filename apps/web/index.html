<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPSflow</title>
    <script>
      // Applies the stored theme before the bundle loads, so a dark session
      // never paints a white frame first. Mirrors src/lib/theme.ts, which
      // owns the preference from then on.
      ;(() => {
        var stored = null
        try {
          stored = localStorage.getItem('opsflow.theme')
        } catch {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
